services:
  wordpress-mcp:
    image: ghcr.io/mbay-odw/wordpress-mcp:latest
    container_name: wordpress-mcp
    restart: unless-stopped
    environment:
      # WordPress connection
      - WP_URL=${WP_URL}
      - WP_USERNAME=${WP_USERNAME}
      - WP_APP_PASSWORD=${WP_APP_PASSWORD}
      # Transport / listen
      - MCP_TRANSPORT=sse
      - PORT=8000
      # Auth
      - MCP_API_KEY=${MCP_API_KEY}
      - OIDC_INTROSPECTION_URL=${OIDC_INTROSPECTION_URL:-https://authelia.${DOMAIN}/api/oidc/introspection}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-wordpress-mcp}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.wordpress-mcp-sse.rule=Host(`wordpress-mcp.${DOMAIN}`) && PathPrefix(`/sse`)"
      - "traefik.http.routers.wordpress-mcp-sse.entrypoints=websecure"
      - "traefik.http.routers.wordpress-mcp-sse.service=wordpress-mcp-svc"
      - "traefik.http.routers.wordpress-mcp-sse.tls=true"
      - "traefik.http.routers.wordpress-mcp-sse.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.wordpress-mcp-sse.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file"
      - "traefik.http.routers.wordpress-mcp-msg.rule=Host(`wordpress-mcp.${DOMAIN}`) && PathPrefix(`/messages`)"
      - "traefik.http.routers.wordpress-mcp-msg.entrypoints=websecure"
      - "traefik.http.routers.wordpress-mcp-msg.service=wordpress-mcp-svc"
      - "traefik.http.routers.wordpress-mcp-msg.tls=true"
      - "traefik.http.routers.wordpress-mcp-msg.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.wordpress-mcp-msg.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file"
      - "traefik.http.routers.wordpress-mcp-http.rule=Host(`wordpress-mcp.${DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.wordpress-mcp-http.entrypoints=websecure"
      - "traefik.http.routers.wordpress-mcp-http.service=wordpress-mcp-svc"
      - "traefik.http.routers.wordpress-mcp-http.tls=true"
      - "traefik.http.routers.wordpress-mcp-http.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.wordpress-mcp-http.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file"
      - "traefik.http.services.wordpress-mcp-svc.loadbalancer.server.port=8000"
    networks:
      - traefik

networks:
  traefik:
    external: true
