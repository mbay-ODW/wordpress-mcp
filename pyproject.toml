[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordpress-mcp"
version = "0.1.0"
description = "MCP Server für WordPress via REST API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
wordpress-mcp = "wordpress_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wordpress_mcp"]
